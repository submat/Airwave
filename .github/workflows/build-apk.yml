name: radio cherry Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'RadioCherry_3.1.4_AudioVisualizer_AMOLED.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: radio-cherry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build radio cherry 3.1.4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify the exact source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="RadioCherry_3.1.4_AudioVisualizer_AMOLED.zip"
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Required source archive is missing: $ARCHIVE"
            echo "No fallback archive is permitted. Commit the exact file to the repository root."
            ls -la
            exit 1
          fi
          unzip -tq "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "Using source archive: $ARCHIVE"
          sha256sum "$ARCHIVE"

      - name: Locate preinstalled Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found under ${ANDROID_HOME}/cmdline-tools."
            find "${ANDROID_HOME}" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using Android SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept SDK licences and install Android 36 packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS=${PIPESTATUS[1]}
          set -e
          if [[ "$SDK_STATUS" -ne 0 ]]; then
            echo "::error::sdkmanager --licenses failed with exit code $SDK_STATUS."
            exit "$SDK_STATUS"
          fi
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract Radio Cherry source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/radio-cherry-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -oq "${{ steps.source.outputs.archive }}" -d "$EXTRACT_DIR"
          PROJECT_DIR="$EXTRACT_DIR/EnglishRadioTest"
          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/values/strings.xml"
            "app/src/main/java/com/example/englishradio/MainActivity.kt"
            "app/src/main/java/com/example/englishradio/PlaybackService.kt"
            "app/src/main/java/com/example/englishradio/ImportedStations.kt"
            "app/src/main/java/com/example/englishradio/PlaylistResolver.kt"
            "app/src/main/assets/playlists/station_data.csv"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$PROJECT_DIR/$file" ]]; then
              echo "::error::Required project file missing or empty: $PROJECT_DIR/$file"
              exit 1
            fi
          done
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Extracted project: $PROJECT_DIR"

      - name: Verify Radio Cherry 3.1.4 UI and Android configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 15' app/build.gradle.kts
          grep -Fq 'versionName = "3.1.4"' app/build.gradle.kts
          grep -Fq '<string name="app_name">radio cherry</string>' app/src/main/res/values/strings.xml
          grep -Fq 'RadioTab.NOW_PLAYING' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'RadioTab.BROWSE' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'RadioTab.FAVORITES' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'isSystemInDarkTheme()' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'background = Color(0xFF000000)' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'horizontalScroll(rememberScrollState())' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'theme_mode' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'ACTION_PREVIOUS' app/src/main/java/com/example/englishradio/PlaybackService.kt
          grep -Fq 'ACTION_NEXT' app/src/main/java/com/example/englishradio/PlaybackService.kt
          grep -Fq 'CommandButton.ICON_PREVIOUS' app/src/main/java/com/example/englishradio/PlaybackService.kt
          grep -Fq 'CommandButton.ICON_NEXT' app/src/main/java/com/example/englishradio/PlaybackService.kt
          if grep -Eq 'ICON_SKIP_PREVIOUS|ICON_SKIP_NEXT' app/src/main/java/com/example/englishradio/PlaybackService.kt; then
            echo '::error::Unsupported Media3 CommandButton icon constant found.'
            exit 1
          fi
          grep -Fq 'private fun PageHero' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'PageHero("radio cherry"' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'waveform: FloatArray, level: Float' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'val sampleIndex = (t * (waveform.size - 1))' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'android.os.Handler(android.os.Looper.getMainLooper()).post' app/src/main/java/com/example/englishradio/MainActivity.kt
          if grep -Fq 'Text("Radio Cherry"' app/src/main/java/com/example/englishradio/MainActivity.kt; then
            echo '::error::Duplicate Radio Cherry empty-state title remains below the hero.'
            exit 1
          fi
          grep -Fq 'contourCount = 13' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'glowSpecs' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq '0xFF17D9D0' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq '0xFF398CFB' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq '0xFF9E49F0' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Fq 'private fun RadioBottomNavigation' app/src/main/java/com/example/englishradio/MainActivity.kt
          grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*36' app/build.gradle.kts
          grep -Eq 'targetSdk[[:space:]]*=[[:space:]]*36' app/build.gradle.kts
          grep -Fq 'id("com.android.application") version "8.13.2" apply false' build.gradle.kts
          grep -Fq 'id("org.jetbrains.kotlin.android") version "2.2.21" apply false' build.gradle.kts
          grep -Fq 'id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false' build.gradle.kts
          grep -Fq 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17' app/build.gradle.kts
          echo "Source identity, audio-reactive waveform, three-screen UI, light/dark theme, SDK and compiler versions verified."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and launcher label
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi
          if [[ ! -x "$AAPT" ]]; then
            echo "::error::aapt not found at $AAPT"
            exit 1
          fi
          BADGING="$($AAPT dump badging "$APK")"
          grep -Fq "package: name='com.example.englishradio'" <<< "$BADGING"
          grep -Fq "application-label:'radio cherry'" <<< "$BADGING"
          echo "apk_path=${{ steps.project.outputs.project_dir }}/$APK" >> "$GITHUB_OUTPUT"
          echo "APK verified: package com.example.englishradio; launcher label radio cherry."
          ls -lh "$APK"

      - name: Upload radio cherry APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-cherry-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## radio cherry 3.1.4"
            echo
            echo "Source archive: ${{ steps.source.outputs.archive }}"
            echo "Source SHA-256: ${{ steps.source.outputs.sha256 }}"
            echo
            echo "The workflow builds only the named source archive. No legacy ZIP fallback is configured."
          } >> "$GITHUB_STEP_SUMMARY"
