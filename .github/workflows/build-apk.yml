name: radio cherry Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.webp'
      - 'AIRWAVE_GitHub_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: radio-cherry-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Radio Cherry debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Do not request the obsolete SDK package named "tools".
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences and install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate or extract Radio Cherry project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "app/build.gradle.kts" ]]; then
            PROJECT_DIR="."
          elif [[ -f "EnglishRadioTest/app/build.gradle.kts" ]]; then
            PROJECT_DIR="EnglishRadioTest"
          elif [[ -f "radio-cherry_GitHub_Build.zip" ]]; then
            unzip -oq "radio-cherry_GitHub_Build.zip"
            if [[ -f "EnglishRadioTest/app/build.gradle.kts" ]]; then
              PROJECT_DIR="EnglishRadioTest"
            else
              echo "::error::The ZIP does not contain EnglishRadioTest/app/build.gradle.kts"
              exit 1
            fi
          else
            echo "::error::Could not find app/build.gradle.kts or radio-cherry_GitHub_Build.zip"
            echo "Upload the project files to the repository, or place radio-cherry_GitHub_Build.zip in the repository root."
            exit 1
          fi

          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Building project from: ${PROJECT_DIR}"

      - name: Verify Android project configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          echo "Project structure and compileSdk configuration verified."

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated at ${APK}"
            exit 1
          fi
          echo "path=${{ steps.project.outputs.project_dir }}/${APK}" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload Radio Cherry APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Cherry-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
