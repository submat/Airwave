name: radio cherry Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'AIRWAVE_GitHub_Build_KotlinFix.zip'
      - 'AIRWAVE_GitHub_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: radio-cherry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build radio cherry
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Intentionally do not use android-actions/setup-android@v3.
      # That action requests the obsolete SDK package "tools".
      - name: Locate preinstalled Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager not found under ${ANDROID_HOME}/cmdline-tools."
            find "${ANDROID_HOME}" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using Android SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept SDK licences and install Android 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"

          # sdkmanager may finish before 'yes'; do not treat yes/SIGPIPE as a build failure.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract patched Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          # Prefer the patched archive. The original archive is a fallback only.
          if [[ -f "AIRWAVE_GitHub_Build_KotlinFix.zip" ]]; then
            ARCHIVE="AIRWAVE_GitHub_Build_KotlinFix.zip"
          elif [[ -f "AIRWAVE_GitHub_Build.zip" ]]; then
            ARCHIVE="AIRWAVE_GitHub_Build.zip"
            echo "::warning::Using the original archive; the KotlinFix archive was not found."
          else
            echo "::error::Neither AIRWAVE_GitHub_Build_KotlinFix.zip nor AIRWAVE_GitHub_Build.zip exists in the repository root."
            ls -la
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/radio-cherry-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -oq "$ARCHIVE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/EnglishRadioTest"
          for file in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/example/englishradio/MainActivity.kt; do
            if [[ ! -f "$PROJECT_DIR/$file" ]]; then
              echo "::error::Required project file missing: $PROJECT_DIR/$file"
              echo "Archive contents:"
              find "$EXTRACT_DIR" -maxdepth 6 -type f | sort
              exit 1
            fi
          done

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Extracted $ARCHIVE"
          echo "Project directory: $PROJECT_DIR"

      - name: Set app label to lowercase radio cherry
        shell: bash
        run: |
          set -euo pipefail
          STRINGS_FILE="${{ steps.project.outputs.project_dir }}/app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "$STRINGS_FILE")"

          python3 - "$STRINGS_FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text(encoding="utf-8") if path.exists() else "<resources>\n</resources>\n"
          pattern = r'(<string\s+name="app_name"\s*>).*?(</string>)'
          updated, count = re.subn(pattern, r'\1radio cherry\2', source, count=1, flags=re.S)
          if count == 0:
              updated = source.replace("</resources>", '    <string name="app_name">radio cherry</string>\n</resources>')
          path.write_text(updated, encoding="utf-8")
          print("Launcher label: radio cherry")
          PY

      - name: Verify project SDK and plugin versions
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*36' app/build.gradle.kts
          grep -Eq 'targetSdk[[:space:]]*=[[:space:]]*36' app/build.gradle.kts
          grep -Fq 'id("com.android.application") version "8.13.2" apply false' build.gradle.kts
          grep -Fq 'id("org.jetbrains.kotlin.android") version "2.2.21" apply false' build.gradle.kts
          grep -Fq 'id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false' build.gradle.kts
          grep -Fq 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17' app/build.gradle.kts
          echo "Verified compileSdk 36, targetSdk 36, AGP 8.13.2, Kotlin 2.2.21, JVM 17."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not produced at $APK"
            exit 1
          fi
          echo "apk_path=${{ steps.project.outputs.project_dir }}/$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload radio cherry APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-cherry-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
