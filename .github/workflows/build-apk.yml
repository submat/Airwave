name: radio cherry Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'radio-cherry_GitHub_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project archive
        run: |
          if [ -f radio-cherry_GitHub_Build.zip ]; then
            unzip -oq radio-cherry_GitHub_Build.zip
          fi
          test -d EnglishRadioTest

      - name: Build debug APK
        working-directory: EnglishRadioTest
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-cherry-2.4.0-debug-apk
          path: EnglishRadioTest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
