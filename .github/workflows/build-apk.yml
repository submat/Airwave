name: Radio Cherry Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.webp'
      - 'radio-cherry_GitHub_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: radio-cherry-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Radio Cherry debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK tools
        id: android
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Could not locate sdkmanager under ${ANDROID_HOME}/cmdline-tools"
            find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager=${SDKMANAGER}" >> "$GITHUB_OUTPUT"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK manager: ${SDKMANAGER}"
          "${SDKMANAGER}" --version

      - name: Accept Android SDK licences and install project SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${{ steps.android.outputs.sdkmanager }}"

          # Accept licences before installing SDK components.
          # Disable pipefail for this pipeline because `yes` can receive SIGPIPE
          # after sdkmanager has accepted the required responses.
          set +o pipefail
          yes | "${SDKMANAGER}" --licenses
          set -o pipefail

          # The checked-in Radio Cherry project declares compileSdk = 36
          # and targetSdk = 36 in EnglishRadioTest/app/build.gradle.kts.
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate or extract Radio Cherry project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "app/build.gradle.kts" ]]; then
            PROJECT_DIR="."
          elif [[ -f "EnglishRadioTest/app/build.gradle.kts" ]]; then
            PROJECT_DIR="EnglishRadioTest"
          elif [[ -f "radio-cherry_GitHub_Build.zip" ]]; then
            unzip -oq "radio-cherry_GitHub_Build.zip"

            if [[ -f "app/build.gradle.kts" ]]; then
              PROJECT_DIR="."
            elif [[ -f "EnglishRadioTest/app/build.gradle.kts" ]]; then
              PROJECT_DIR="EnglishRadioTest"
            else
              echo "::error::The ZIP does not contain app/build.gradle.kts or EnglishRadioTest/app/build.gradle.kts"
              exit 1
            fi
          else
            echo "::error::Android project not found."
            echo "Expected the project in the repository root, EnglishRadioTest/, or radio-cherry_GitHub_Build.zip in the repository root."
            exit 1
          fi

          echo "project_dir=${PROJECT_DIR}" >> "$GITHUB_OUTPUT"
          echo "Building project from: ${PROJECT_DIR}"

      - name: Verify Android project configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          for file in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required project file is missing: $file"
              exit 1
            fi
          done

          grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*36' app/build.gradle.kts || {
            echo "::error::This workflow installs Android SDK 36, but app/build.gradle.kts does not declare compileSdk = 36."
            exit 1
          }

          echo "Project files verified; compileSdk 36 confirmed."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Radio Cherry debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated at ${APK}"
            exit 1
          fi

          echo "path=${{ steps.project.outputs.project_dir }}/${APK}" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload Radio Cherry APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Cherry-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
