name: radio cherry Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'AIRWAVE_GitHub_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: radio-cherry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build radio cherry
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Do not request the obsolete Android SDK "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract the exact project archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="AIRWAVE_GitHub_Build.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Missing ${ARCHIVE} in the repository root."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/radio-cherry-source"

          PROJECT_DIR="$RUNNER_TEMP/radio-cherry-source/EnglishRadioTest"
          if [[ ! -f "$PROJECT_DIR/settings.gradle.kts" || \
                ! -f "$PROJECT_DIR/build.gradle.kts" || \
                ! -f "$PROJECT_DIR/app/build.gradle.kts" || \
                ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]]; then
            echo "::error::The archive does not contain the expected EnglishRadioTest Android project structure."
            find "$RUNNER_TEMP/radio-cherry-source" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Extracted project: $PROJECT_DIR"

      - name: Set launcher display name to radio cherry
        shell: bash
        run: |
          set -euo pipefail
          STRINGS_FILE="$PROJECT_DIR/app/src/main/res/values/strings.xml"
          if [[ ! -f "$STRINGS_FILE" ]]; then
            echo "::error::Missing app strings file: $STRINGS_FILE"
            exit 1
          fi

          python3 - "$STRINGS_FILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          pattern = r'(<string\s+name="app_name"\s*>).*?(</string>)'
          updated, count = re.subn(pattern, r'\1radio cherry\2', content, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not find exactly one app_name string in strings.xml")
          path.write_text(updated, encoding="utf-8")
          print("Launcher label set to: radio cherry")
          PY

      - name: Verify Android build configuration
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          grep -Eq 'compileSdk\s*=\s*36' app/build.gradle.kts
          grep -Eq 'targetSdk\s*=\s*36' app/build.gradle.kts
          grep -Eq 'id\("com.android.application"\) version "8\.13\.2"' build.gradle.kts
          grep -Eq 'id\("org.jetbrains.kotlin.android"\) version "2\.2\.21"' build.gradle.kts

          echo "Verified: compileSdk 36, targetSdk 36, AGP 8.13.2, Kotlin 2.2.21."
          grep -n 'app_name' app/src/main/res/values/strings.xml

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Build completed without producing ${APK}."
            exit 1
          fi
          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload radio cherry APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-cherry-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
