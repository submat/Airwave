      - name: Restore and verify release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/radio-cherry-release.p12"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

          echo "Checking PKCS12 keystore..."
          keytool -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD

          echo "Checking signing alias..."
          keytool -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS"

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Keystore and alias verified."
