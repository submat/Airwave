name: radio cherry signed release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'RadioCherry_3.1.5_AudioVisualizer_Fix.zip'
      - '.github/workflows/radio-cherry-release-apk.yml'

permissions:
  contents: read

concurrency:
  group: radio-cherry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign radio cherry 3.1.5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          echo "All four signing secrets are present."

      - name: Verify the exact source archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="RadioCherry_3.1.5_AudioVisualizer_Fix.zip"
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Required source archive is missing: $ARCHIVE"
            echo "Commit the exact ZIP to the repository root."
            ls -la
            exit 1
          fi
          unzip -tq "$ARCHIVE"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          sha256sum "$ARCHIVE"

      - name: Locate Android SDK manager
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found."
            find "${ANDROID_HOME}" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version

      - name: Accept SDK licences and install Android 36 packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"
          set +e
          yes | "$SDKMANAGER" --licenses >/dev/null
          SDK_STATUS=${PIPESTATUS[1]}
          set -e
          if [[ "$SDK_STATUS" -ne 0 ]]; then
            echo "::error::sdkmanager --licenses failed with exit code $SDK_STATUS."
            exit "$SDK_STATUS"
          fi
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract and validate radio cherry source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="$RUNNER_TEMP/radio-cherry-source"
          mkdir -p "$EXTRACT_DIR"
          unzip -oq "${{ steps.source.outputs.archive }}" -d "$EXTRACT_DIR"
          PROJECT_DIR="$EXTRACT_DIR/EnglishRadioTest"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/values/strings.xml"
            "app/src/main/java/com/example/englishradio/MainActivity.kt"
            "app/src/main/java/com/example/englishradio/TvActivity.kt"
            "app/src/main/res/drawable-nodpi/tv_banner.png"
            "app/src/main/java/com/example/englishradio/PlaybackService.kt"
            "app/src/main/java/com/example/englishradio/ImportedStations.kt"
            "app/src/main/java/com/example/englishradio/PlaylistResolver.kt"
            "app/src/main/assets/playlists/station_data.csv"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -s "$PROJECT_DIR/$file" ]]; then
              echo "::error::Required project file missing or empty: $PROJECT_DIR/$file"
              exit 1
            fi
          done

          grep -Fq 'applicationId = "com.example.englishradio"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 16' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "3.1.5"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq '<string name="app_name">radio cherry</string>' "$PROJECT_DIR/app/src/main/res/values/strings.xml"
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Validated project: $PROJECT_DIR"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Restore and verify release keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/radio-cherry-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Decoded release keystore is empty."
            exit 1
          fi
          echo "Checking PKCS12 keystore..."
          keytool -list -storetype PKCS12 \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD
          echo "Checking signing alias..."
          keytool -list -storetype PKCS12 \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Keystore and alias verified."

      - name: Align and sign Release APK
        id: sign
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/36.0.0"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/radio-cherry-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/radio-cherry-3.1.5-release.apk"

          if [[ ! -s "$UNSIGNED_APK" ]]; then
            echo "::error::Unsigned Release APK not found: $UNSIGNED_APK"
            find app/build/outputs -maxdepth 5 -type f -name '*.apk' -print || true
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"
          test -s "$SIGNED_APK"
          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          ls -lh "$SIGNED_APK"

      - name: Verify package name and launcher label
        shell: bash
        env:
          SIGNED_APK: ${{ steps.sign.outputs.signed_apk }}
        run: |
          set -euo pipefail
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$SIGNED_APK")"
          grep -Fq "package: name='com.example.englishradio' versionCode='16' versionName='3.1.5'" <<< "$BADGING"
          grep -Fq "application-label:'radio cherry'" <<< "$BADGING"
          echo "Verified package com.example.englishradio, version 3.1.5, launcher label radio cherry."

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-cherry-3.1.5-signed-release-apk
          path: ${{ steps.sign.outputs.signed_apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## radio cherry 3.1.5 — Signed Release APK"
            echo
            echo "Source archive: ${{ steps.source.outputs.archive }}"
            echo "Source SHA-256: ${{ steps.source.outputs.sha256 }}"
            echo
            echo "The APK is signed with the release keystore supplied through GitHub Actions Secrets."
            echo "The keystore and signing passwords are not included in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"
